[package]
edition = "2024"
rust-version = "1.89"
name = "iroh"
version = "0.97.0"
authors = [
    "dignifiedquire <me@dignifiedquire.com>",
    "n0 team",
]
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "p2p quic connections dialed by public key"
readme = "README.md"
keywords = [
    "quic",
    "networking",
    "holepunching",
    "p2p",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/n0-computer/iroh"
resolver = "2"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "--cfg",
    "iroh_docsrs",
]

[features]
address-lookup-mdns = ["dep:swarm-discovery"]
address-lookup-pkarr-dht = [
    "pkarr/dht",
    "pkarr/relays",
]
default = [
    "metrics",
    "fast-apple-datapath",
    "portmapper",
]
fast-apple-datapath = ["noq/fast-apple-datapath"]
metrics = [
    "iroh-metrics/metrics",
    "iroh-relay/metrics",
    "portmapper?/metrics",
]
platform-verifier = ["iroh-relay/platform-verifier"]
portmapper = ["dep:portmapper"]
qlog = ["noq/qlog"]
test-utils = [
    "iroh-relay/test-utils",
    "iroh-relay/server",
    "dep:axum",
]
unstable-custom-transports = []

[lib]
name = "iroh"
crate-type = [
    "lib",
    "cdylib",
]
path = "src/lib.rs"

